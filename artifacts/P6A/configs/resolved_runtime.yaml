model:
  D: 4
  _target_: models.ReScene
  config:
    backbone:
      _target_: models.PointceptBackbone
      custom_config:
        enc_mode: false
      decoder_serializations:
      - standard
      - temporal_overlay
      model_lib: concerto
      name: external:concerto/concerto_base.pth
      repo_id: Pointcept/Concerto
    backbone_wrapper: true
    temporal_window: 2
  dim_feedforward: 1024
  dropout: 0.0
  gauss_scale: 1.0
  hidden_dim: 128
  hlevels:
  - 0
  - 1
  - 2
  - 3
  max_sample_size: false
  non_parametric_queries: true
  normalize_pos_enc: true
  num_changes: 6
  num_classes: 19
  num_decoders: 3
  num_heads: 8
  num_queries: 100
  positional_encoding_type: fourier
  pre_norm: false
  random_normal: false
  random_queries: false
  random_query_both: false
  return_query_features: true
  sample_sizes:
  - 200
  - 800
  - 3200
  - 12800
  - 51200
  save_segment_info: false
  scatter_type: mean
  shared_decoder: true
  temporal_masking: false
  train_on_segments: true
  use_changes_loss: false
  use_level_embed: false
  use_np_features: false
  voxel_size: 0.02
optimizer:
  _target_: torch.optim.AdamW
  amsgrad: false
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  lr: 0.0005
  weight_decay: 0.01
p2_preflight:
  artifact_path: artifacts/P2/scannet_preflight.json
  target: rescene4d_concerto_t2
scheduler:
  pytorch_lightning_params:
    interval: step
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    anneal_strategy: cos
    base_momentum: 0.85
    cycle_momentum: true
    div_factor: 25.0
    epochs: 450
    final_div_factor: 10000.0
    last_epoch: -1
    max_lr: 0.0005
    max_momentum: 0.95
    pct_start: 0.3
    three_phase: false
    total_steps: -1
trainer:
  accumulate_grad_batches: 8
  check_val_every_n_epoch: 15
  deterministic: false
  gradient_clip_val: 1.0
  max_epochs: 450
  min_epochs: 1
  num_sanity_val_steps: 2
  precision: 32-true
  strategy: ddp_find_unused_parameters_true
