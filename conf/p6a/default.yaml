    paired_delta_ci_high_max: 0.0
  G6A-2:
    horizons: [3, 4, 5]
    reactivation_accuracy_min: 0.7
    reactivation_recall_min: 0.25
  G6A-3:
    raw_prediction_fingerprint: exact
    metric_absolute_tolerance: 1.0e-12
  G6A-4:
    horizon: 2
    online_metric_drop_max: 0.05
    long_horizon_any_positive: true
    horizons: [4, 5]
    metrics: [t_mAP, t_REC]
  G6A-5:
    primary_failure_share_min: 0.9
