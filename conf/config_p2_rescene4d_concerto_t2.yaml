defaults:
  - config_base_instance_segmentation
  - override data/datasets: mix
  - override model: rescene
  - override backbone: concerto
  - override serialization: mixed
  - override optimizer: adamw
  - override scheduler: onecyclelr
  - override trainer: trainer
  - override logging: local_csv
  - override callbacks: p2_reproduction
  - override matcher: hungarian_matcher
  - override loss: set_criterion
  - override loss/contrastive: infoNCE
  - _self_

# Reproduction choice: t-SIM is outside G2 and its required inputs are disabled.
aux_metric: null

p2_preflight:
  target: rescene4d_concerto_t2
  artifact_path: artifacts/P2/scannet_preflight.json

general:
  train_mode: true
  seed: 45
  freeze: backbone_encoder
  gpus: 2
  project_name: rescene4d_concerto_t2_repro
  workspace: null
  experiment_name: rescene4d_concerto_t2_repro
  save_dir: checkpoints/rescene4d_concerto_t2_repro
  p2_weighted_objective: true
  p2_fail_closed_runtime: true

data:
  batch_size: 4
  voxel_size: 0.02
  train_dataset:
    filter_out_classes: [0, 1, 255]
    exclude_unsupervised_sequences: true
    fail_closed: true
    known_empty_scan_policy: official_substitute
    epoch_sample_multiple: 32
    sampler_seed: 45
  validation_dataset:
    filter_out_classes: [0, 1, 255]
    exclude_unsupervised_sequences: true
    fail_closed: true
    known_empty_scan_policy: official_substitute
  test_dataset:
    filter_out_classes: [0, 1, 255]
    exclude_unsupervised_sequences: true
    fail_closed: true
    known_empty_scan_policy: official_substitute

backbone:
  name: ${oc.env:CONCERTO_CHECKPOINT,${oc.env:HOME}/.cache/persist4d/concerto/concerto_base.pth}

model:
  num_queries: 100
  non_parametric_queries: true
  random_query_both: false
  random_normal: false
  random_queries: false
  temporal_masking: false
  config:
    temporal_window: 2

loss:
  eos_coef: 0.2

optimizer:
  lr: 0.0005
  # Reproduction choices: explicit PyTorch defaults, not paper-reported values.
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  amsgrad: false

scheduler:
  scheduler:
    # Reproduction choices: explicit PyTorch defaults, not paper-reported values.
    pct_start: 0.3
    anneal_strategy: cos
    cycle_momentum: true
    base_momentum: 0.85
    max_momentum: 0.95
    div_factor: 25.0
    final_div_factor: 10000.0
    three_phase: false
    last_epoch: -1

trainer:
  max_epochs: 450
  accumulate_grad_batches: 4
  precision: 32-true
