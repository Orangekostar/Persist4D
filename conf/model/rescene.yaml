# @package model
_target_: models.ReScene

# transformer parameters
hidden_dim: 128
dim_feedforward: 1024
num_queries: 100
num_heads: 8
num_decoders: 3
dropout: 0.0
pre_norm: false
use_level_embed: false
normalize_pos_enc: true
positional_encoding_type: "fourier"
gauss_scale: 1.0
hlevels: [0,1,2,3]

# queries
non_parametric_queries: true
random_query_both: false
random_normal: false
random_queries: false
use_np_features: false

# sampling
sample_sizes: [200, 800, 3200, 12800, 51200]
max_sample_size: false # change false means sampling activated

shared_decoder: true
num_classes: ${general.num_targets}
train_on_segments: ${general.train_on_segments}
scatter_type: "mean"

voxel_size: ${data.voxel_size}
# number of dimensions 
D: 4
num_changes: ${general.num_changes}
temporal_masking: false
use_changes_loss: false
save_segment_info: ${general.save_segment_info}
return_query_features: false

config:
  backbone: ${backbone}
  temporal_window: 2
  backbone_wrapper: true
